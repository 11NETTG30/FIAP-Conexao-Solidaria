services:
  postgres:
    image: postgres:18.1
    container_name: conexao-solidaria-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - conexao-solidaria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: conexao-solidaria-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - conexao-solidaria-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: conexao-solidaria-migrate
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conexao-solidaria-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: conexao-solidaria-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ConexaoSolidaria.API
      JwtSettings__Audience: ConexaoSolidaria.Client
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - conexao-solidaria-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  conexao-solidaria-network:
    driver: bridge