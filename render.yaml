databases:
  - name: conexao-solidaria-db
    plan: free
    databaseName: conexao_solidaria
    user: fcgadmin

services:
  - type: web
    name: conexao-solidaria-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: JwtSettings__Issuer
        value: FCG.API
      - key: JwtSettings__Audience
        value: FCG.Client
      - key: JwtSettings__Secret
        generateValue: true
      - key: PGHOST
        fromDatabase:
          name: conexao-solidaria-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: conexao-solidaria-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: conexao-solidaria-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: conexao-solidaria-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: conexao-solidaria-db
          property: password
