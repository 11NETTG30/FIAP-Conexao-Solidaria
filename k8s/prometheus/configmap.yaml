apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: conexao-solidaria
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Descoberta via DNS do Service headless: cada pod da API vira um
      # target próprio, sem precisar de RBAC para a API do Kubernetes.
      - job_name: conexao-solidaria-api
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["conexao-solidaria-api-metrics.conexao-solidaria.svc.cluster.local"]
            type: A
            port: 8080
