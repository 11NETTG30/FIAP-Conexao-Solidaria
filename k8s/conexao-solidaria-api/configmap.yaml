apiVersion: v1
kind: ConfigMap
metadata:
  name: conexao-solidaria-api-config
  namespace: conexao-solidaria
data:
  ASPNETCORE_ENVIRONMENT: Development
  RUN_MIGRATIONS_ON_STARTUP: "true"
  JwtSettings__Issuer: ConexaoSolidaria.API
  JwtSettings__Audience: ConexaoSolidaria.Client
  JwtSettings__ExpiracaoAccessTokenMinutos: "30"
  JwtSettings__ExpiracaoRefreshTokenDias: "7"
  JwtSettings__HabilitarSegurancaDeReusoRefreshToken: "false"
  RabbitMqSettings__Host: rabbitmq
  RabbitMqSettings__VirtualHost: /
  RabbitMqSettings__Username: conexao-solidaria
  OTEL_SERVICE_NAME: conexao-solidaria-api
  # Traces e logs via OTLP ficam desligados até existir um coletor no cluster:
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317