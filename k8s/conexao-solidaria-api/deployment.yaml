apiVersion: apps/v1
kind: Deployment
metadata:
  name: conexao-solidaria-api
  namespace: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conexao-solidaria-api
  template:
    metadata:
      labels:
        app: conexao-solidaria-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Aguardando Postgres..."
                sleep 3
              done
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do
                echo "Aguardando RabbitMQ..."
                sleep 3
              done
      containers:
        - name: conexao-solidaria-api
          image: conexao-solidaria-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: conexao-solidaria-api-config
            - secretRef:
                name: conexao-solidaria-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi